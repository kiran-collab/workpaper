    select('ctx');

    const go = (k) => { i = (k + STEPS.length) % STEPS.length; step(i); };
    const stop = () => { clearInterval(timer); timer = null; document.getElementById('play').textContent = 'Play'; };
    dots.onclick = (e) => { const b = e.target.closest('button'); if (b) { stop(); go(+b.dataset.k); } };
    document.getElementById('prev').onclick = () => { stop(); go(i - 1); };
    document.getElementById('next').onclick = () => { stop(); go(i + 1); };

// Fold demo
function renderFold() {
  const on = new Set([...document.querySelectorAll('#events input:checked')].map(x => +x.dataset.ev));
  document.querySelectorAll('#events label').forEach(l => l.classList.toggle('off', !l.querySelector('input').checked));
  const adj = {}; let signoff = null;
  for (const e of DEMO) {
    if (!on.has(e.id)) continue;
    if (e.type === 'propose') adj[e.adj] = { fed: e.fed, status: 'proposed', approvals: [] };
    if (e.type === 'approve' && adj[e.adj]) { adj[e.adj].approvals.push(e.level); if (e.level === 'partner' || Math.abs(adj[e.adj].fed) <= 1000) adj[e.adj].status = 'approved'; }
    if (e.type === 'signoff') signoff = JSON.stringify(adj);
  }
  const fp = JSON.stringify(adj);
  const tax = 81962 + Object.values(adj).reduce((s, a) => s + a.fed, 0);
  const so = signoff == null ? ['Not signed', ''] : signoff === fp ? ['Fresh', 'ok'] : ['Reopened · adjustments changed after sign-off', 'warn'];
  const row = (k, label) => adj[k] ? `<span>${label}</span><span class="pill ${adj[k].status === 'approved' ? 'ok' : 'prop'}">${adj[k].status}${adj[k].status === 'proposed' && adj[k].approvals.length ? ' · needs partner' : ''}</span>` : `<span>${label}</span><span class="pill">none</span>`;
  document.getElementById('foldout').innerHTML = `
    <div><small style="color:var(--muted)">Federal total tax (workpaper)</small><div class="big">${tax.toLocaleString('en-US')}</div><small style="color:var(--muted)">Engine v3: 81,962 · change <span class="${cls(tax - 81962)}">${fmt(tax - 81962)}</span></small></div>
    <div class="kv">${row('rsu', 'RSU basis adjustment')}${row('c6', 'Crypto C6 adjustment')}<span>Investments sign-off</span><span class="pill ${so[1]}">${so[0]}</span></div>`;
}

// Errors chart
function chart(st) {
  const el = document.getElementById('chart');
  const data = ERRORS.filter(e => e[st.j]).filter(e => st.k === 'all' || e.kind === st.k).sort((a, b) => a[st.j] - b[st.j]);
  const tip = el.querySelector('.tip');
  el.querySelectorAll('svg').forEach(s => s.remove());
  if (!data.length) { el.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 600 40"><text x="0" y="24" class="lbl">No tax effect in this filter.</text></svg>'); return; }
  const W = 760, L = 170, R = 70, rowH = 26, top = 8, H = top + data.length * rowH + 26;
  const max = Math.max(...data.map(d => Math.abs(d[st.j])));
  const lo = Math.min(0, ...data.map(d => d[st.j])), hi = Math.max(0, ...data.map(d => d[st.j]));
  const span = (hi - lo) || 1;
  const x = (v) => L + (v - lo) / span * (W - L - R);
  const x0 = x(0);
  const step = max > 8000 ? 5000 : max > 2000 ? 1000 : max > 500 ? 250 : 50;
  const ticks = []; for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(t);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${st.j === 'fed' ? 'Federal' : 'California'} tax effect of each issue, in dollars">`;
  svg += ticks.map(t => `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 20}"/><text class="lbl" x="${x(t)}" y="${H - 6}" text-anchor="middle">${t === 0 ? '0' : fmt(t)}</text>`).join('');
  data.forEach((d, i) => {
    const v = d[st.j], y = top + i * rowH, bx = Math.min(x(v), x0), bw = Math.max(2, Math.abs(x(v) - x0));
    svg += `<g data-n="${d.n}"><rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" rx="4"/>
      <text class="lbl" x="${L - 10}" y="${y + 17}" text-anchor="end">${esc(d.short)}</text>
      <rect class="${v > 0 ? 'bar-up' : 'bar-down'}" x="${bx}" y="${y + 6}" width="${bw}" height="${rowH - 12}" rx="3" style="pointer-events:none"/>
      ${bw > 80
        ? `<text class="val in" x="${v > 0 ? x(v) - 8 : x(v) + 8}" y="${y + 17}" text-anchor="${v > 0 ? 'end' : 'start'}" style="pointer-events:none">${fmt(v)}</text>`
        : `<text class="val" x="${v > 0 ? x(v) + 6 : x(v) - 6}" y="${y + 17}" text-anchor="${v > 0 ? 'start' : 'end'}" style="pointer-events:none">${fmt(v)}</text>`}</g>`;
  });
  svg += `<line class="axis" x1="${x0}" x2="${x0}" y1="${top}" y2="${H - 20}"/></svg>`;
  el.insertAdjacentHTML('beforeend', svg);
  const s = el.querySelector('svg');
  s.onmousemove = (e) => {
    const g = e.target.closest('g[data-n]'); if (!g) { tip.style.opacity = 0; return; }
    const d = ERRORS.find(x => x.n == g.dataset.n);
    tip.innerHTML = `<b>#${d.n} ${esc(d.title)}</b><br>Federal ${fmt(d.fed)} · California ${fmt(d.ca)}`;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - r.left + el.scrollLeft + 12, el.scrollWidth - 270) + 'px';
    tip.style.top = (e.clientY - r.top + 12) + 'px'; tip.style.opacity = 1;
  };
  s.onmouseleave = () => tip.style.opacity = 0;
  s.onclick = (e) => {
    const g = e.target.closest('g[data-n]'); if (!g) return;
    document.querySelector(`.err[data-n="${g.dataset.n}"] > button`)?.click();
    document.querySelector(`.err[data-n="${g.dataset.n}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
}

function list(st) {
  let data = ERRORS.filter(e => st.k === 'all' || e.kind === st.k)
    .filter(e => !st.q || (e.title + ' ' + e.what + ' ' + e.how).toLowerCase().includes(st.q));
  if (st.s === 'fx') data = data.slice().sort((a, b) => (Math.abs(b.fed) + Math.abs(b.ca)) - (Math.abs(a.fed) + Math.abs(a.ca)));
  document.getElementById('list').innerHTML = data.map(e => `
    <article class="err" data-n="${e.n}" data-open="${st.open === e.n}">
      <button aria-expanded="${st.open === e.n}"><span class="k">${e.n}</span><span class="t">${esc(e.title)}<small>${KIND[e.kind]}</small></span>
        <span class="fx">${e.pay ? esc(e.pay) : `Fed <span class="${cls(e.fed)}">${e.fed ? fmt(e.fed) : '—'}</span> · CA <span class="${cls(e.ca)}">${e.ca ? fmt(e.ca) : '—'}</span>`}</span></button>
      ${st.open === e.n ? `<div class="body"><p><b>What was wrong.</b> ${esc(e.what)}</p><p><b>How it surfaced.</b> ${esc(e.how)}</p></div>` : ''}
    </article>`).join('') || '<p style="color:var(--muted)">No issues match.</p>';
}

// ---------------------------------------------------------------- router
function route() {
  after._stop?.(); after._stop = null;
  const id = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
  const i = PAGES.indexOf(id);
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page">${views[id]()}</div>
    <nav class="pager" aria-label="Previous and next">
      ${prev ? `<a href="#${prev}"><small>← Previous</small>${TITLES[prev]}</a>` : ''}
      ${next ? `<a class="next" href="#${next}"><small>Next →</small>${TITLES[next]}</a>` : ''}
    </nav>`;
  after[id]?.();
  document.querySelectorAll('nav.top a').forEach(a => a.getAttribute('href') === '#' + id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (route.ran) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  route.ran = true;
}
window.addEventListener('hashchange', route);
route();
</script>
