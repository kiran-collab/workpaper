[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workpaper"
version = "1.0.0"
description = "AI-native tax workpaper: event-sourced web app, Python checks engine, Claude agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
agents = ["anthropic>=2.3"]
dev = [
    "anthropic>=2.3",
    "httpx>=0.27",
    "pytest>=8",
    "playwright>=1.45",
    "ruff>=0.5",
]

[project.scripts]
workpaper = "workpaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider -m 'not e2e'"
markers = ["e2e: real-browser tests that start their own servers (run with: pytest -m e2e)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 200
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
